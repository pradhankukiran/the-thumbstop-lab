<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-label="Specimen analysis — The Thumbstop Lab" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .serif { font-family: 'Instrument Serif', 'Cambria', Georgia, 'Times New Roman', serif; }
      .mono { font-family: 'Geist Mono', ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace; }
      .sans { font-family: 'Geist Sans', ui-sans-serif, 'Inter', -apple-system, BlinkMacSystemFont, Helvetica, sans-serif; }
    </style>
  </defs>

  <!-- Paper -->
  <rect width="1280" height="440" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="1279" height="439" fill="none" stroke="#E8E8E6"/>

  <!-- Corner ticks -->
  <g stroke="#0a0a0a" stroke-width="1.5" fill="none">
    <path d="M8 20 L8 8 L20 8"/>
    <path d="M1260 8 L1272 8 L1272 20"/>
    <path d="M8 420 L8 432 L20 432"/>
    <path d="M1260 432 L1272 432 L1272 420"/>
  </g>

  <!-- Top meta bar -->
  <line x1="40" y1="60" x2="1240" y2="60" stroke="#E8E8E6"/>
  <rect x="40" y="36" width="7" height="7" fill="#FF4A14"/>
  <text x="56" y="44" class="mono" font-size="11" fill="#6b6b6b" letter-spacing="2.2">LAB ACTIVE · EST. 2026 · V1.0 · 2,184,553 HOOKS ANALYZED</text>
  <text x="1240" y="44" class="mono" font-size="11" fill="#6b6b6b" letter-spacing="2.2" text-anchor="end">FIG. 01 — SPECIMEN ANALYSIS</text>

  <!-- Left: headline -->
  <text x="40" y="170" class="serif" font-size="88" fill="#0a0a0a" letter-spacing="-2.5">The science of</text>
  <text x="40" y="252" class="serif" font-style="italic" font-size="88" fill="#0a0a0a" letter-spacing="-2.5">the scroll-stop.</text>

  <text x="40" y="302" class="sans" font-size="15" fill="#3a3a3a">Engineered hooks for short-form video.</text>
  <text x="40" y="324" class="sans" font-size="15" fill="#3a3a3a">Every hook scored across five behavioral vectors.</text>

  <!-- Bottom meta -->
  <line x1="40" y1="390" x2="1240" y2="390" stroke="#E8E8E6"/>
  <text x="40" y="410" class="mono" font-size="10" fill="#a8a8a8" letter-spacing="2.2">SPECIMEN · ILLUSTRATIVE</text>
  <text x="1240" y="410" class="mono" font-size="10" fill="#a8a8a8" letter-spacing="2.2" text-anchor="end">THE THUMBSTOP LAB</text>

  <!-- Right: Score card -->
  <g transform="translate(740, 82)">
    <rect x="0" y="0" width="500" height="290" fill="#ffffff" stroke="#E8E8E6"/>

    <!-- Card corner ticks -->
    <g stroke="#0a0a0a" stroke-width="1.2" fill="none">
      <path d="M4 10 L4 4 L10 4"/>
      <path d="M490 4 L496 4 L496 10"/>
      <path d="M4 280 L4 286 L10 286"/>
      <path d="M490 286 L496 286 L496 280"/>
    </g>

    <!-- Card header -->
    <line x1="0" y1="34" x2="500" y2="34" stroke="#E8E8E6"/>
    <rect x="16" y="16" width="5" height="5" fill="#FF4A14"/>
    <text x="28" y="23" class="mono" font-size="10" fill="#0a0a0a" letter-spacing="2">SUBJECT-0042</text>
    <text x="110" y="23" class="mono" font-size="10" fill="#a8a8a8" letter-spacing="2">·</text>
    <text x="118" y="23" class="mono" font-size="10" fill="#6b6b6b" letter-spacing="2">SAAS</text>
    <text x="152" y="23" class="mono" font-size="10" fill="#a8a8a8" letter-spacing="2">·</text>
    <text x="160" y="23" class="mono" font-size="10" fill="#6b6b6b" letter-spacing="2">2026-04-11</text>
    <text x="484" y="23" class="mono" font-size="10" fill="#6b6b6b" letter-spacing="2" text-anchor="end">THUMBSTOP SCORE</text>

    <!-- Hook quote -->
    <text x="22" y="82" class="serif" font-size="36" fill="#FF4A14">&#8220;</text>
    <text x="48" y="78" class="serif" font-size="20" fill="#0a0a0a">I fired my top salesperson.</text>
    <text x="48" y="102" class="serif" font-size="20" fill="#0a0a0a">Revenue went up 40% the next</text>
    <text x="48" y="126" class="serif" font-size="20" fill="#0a0a0a">quarter.</text>

    <!-- Score -->
    <text x="16" y="168" class="mono" font-size="9" fill="#6b6b6b" letter-spacing="2.4">THUMBSTOP SCORE</text>
    <text x="16" y="236" class="mono" font-size="76" fill="#FF4A14" letter-spacing="-3">91</text>
    <text x="112" y="230" class="mono" font-size="13" fill="#a8a8a8">/100</text>

    <!-- Vector bars -->
    <g transform="translate(196, 154)">
      <!-- CUR 94 -->
      <text x="0" y="10" class="mono" font-size="9" fill="#6b6b6b" letter-spacing="1.4">CUR</text>
      <rect x="46" y="5" width="210" height="5" fill="#F7F7F5"/>
      <rect x="46" y="5" width="197.4" height="5" fill="#0a0a0a"/>
      <rect x="243.4" y="5" width="1.2" height="5" fill="#FF4A14"/>
      <text x="290" y="10" class="mono" font-size="11" fill="#0a0a0a" text-anchor="end">94</text>
      <!-- SPC 88 -->
      <text x="0" y="30" class="mono" font-size="9" fill="#6b6b6b" letter-spacing="1.4">SPC</text>
      <rect x="46" y="25" width="210" height="5" fill="#F7F7F5"/>
      <rect x="46" y="25" width="184.8" height="5" fill="#0a0a0a"/>
      <rect x="230.8" y="25" width="1.2" height="5" fill="#FF4A14"/>
      <text x="290" y="30" class="mono" font-size="11" fill="#0a0a0a" text-anchor="end">88</text>
      <!-- PAT 91 -->
      <text x="0" y="50" class="mono" font-size="9" fill="#6b6b6b" letter-spacing="1.4">PAT</text>
      <rect x="46" y="45" width="210" height="5" fill="#F7F7F5"/>
      <rect x="46" y="45" width="191.1" height="5" fill="#0a0a0a"/>
      <rect x="237.1" y="45" width="1.2" height="5" fill="#FF4A14"/>
      <text x="290" y="50" class="mono" font-size="11" fill="#0a0a0a" text-anchor="end">91</text>
      <!-- EMO 82 -->
      <text x="0" y="70" class="mono" font-size="9" fill="#6b6b6b" letter-spacing="1.4">EMO</text>
      <rect x="46" y="65" width="210" height="5" fill="#F7F7F5"/>
      <rect x="46" y="65" width="172.2" height="5" fill="#0a0a0a"/>
      <rect x="218.2" y="65" width="1.2" height="5" fill="#FF4A14"/>
      <text x="290" y="70" class="mono" font-size="11" fill="#0a0a0a" text-anchor="end">82</text>
      <!-- STK 89 -->
      <text x="0" y="90" class="mono" font-size="9" fill="#6b6b6b" letter-spacing="1.4">STK</text>
      <rect x="46" y="85" width="210" height="5" fill="#F7F7F5"/>
      <rect x="46" y="85" width="186.9" height="5" fill="#0a0a0a"/>
      <rect x="232.9" y="85" width="1.2" height="5" fill="#FF4A14"/>
      <text x="290" y="90" class="mono" font-size="11" fill="#0a0a0a" text-anchor="end">89</text>
    </g>

    <!-- Card footer -->
    <line x1="0" y1="258" x2="500" y2="258" stroke="#E8E8E6"/>
    <text x="16" y="276" class="mono" font-size="9" fill="#a8a8a8" letter-spacing="2">SPECIMEN · ILLUSTRATIVE</text>
    <text x="484" y="276" class="mono" font-size="9" fill="#a8a8a8" letter-spacing="2" text-anchor="end">THE THUMBSTOP LAB</text>
  </g>
</svg>
